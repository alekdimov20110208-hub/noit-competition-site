# D1 reviewable provider-native recipe. Applying it provisions PAID infrastructure
# and is NOT authorized in D1. Secrets and verified CA file are D2 prerequisites.
services:
  - type: web
    name: budograph
    runtime: node
    plan: 0.5c-512mb
    region: frankfurt
    numInstances: 1
    autoDeployTrigger: off
    buildCommand: pnpm install --frozen-lockfile --prod=false && pnpm production:build
    startCommand: pnpm production:start
    healthCheckPath: /api/health/ready
    envVars:
      - key: NODE_VERSION
        value: 24.16.0
      - key: NODE_ENV
        value: production
      - key: HOST
        value: 0.0.0.0
      - key: PORT
        value: 10000
      - key: WEB_CONCURRENCY
        value: "1"
      - key: SERVE_FRONTEND
        value: "true"
      - key: REMINDER_WORKER_ENABLED
        value: "true"
      - key: DATABASE_TLS_MODE
        value: verify-full
      - key: DATABASE_TLS_CA_FILE
        value: /etc/secrets/database-ca.pem
      - key: DATABASE_URL
        sync: false
      - key: BETTER_AUTH_SECRET
        sync: false
      - key: BETTER_AUTH_URL
        sync: false
      - key: PUBLIC_APP_URL
        sync: false
      - key: EMAIL_MODE
        value: resend
      - key: EMAIL_FROM
        sync: false
      - key: RESEND_API_KEY
        sync: false
