# D2.2 isolated FREE staging only. Local preparation is not deployment approval.
# One service, no paid resources. No preDeployCommand or migration execution.
# Upload verified database-ca.pem as a Render Secret File before first start.
# Free sleeps after 15 idle minutes: no reliable reminders/continuous mail.
# See docs/BUDOGRAPH_SAFE_STAGING_D2_2.md before any manual deployment.
services:
  - type: web
    name: budograph-staging
    runtime: node
    plan: free
    region: frankfurt
    numInstances: 1
    branch: staging/render-free-d2-2
    maxShutdownDelaySeconds: 120
    autoDeployTrigger: off
    buildCommand: pnpm install --frozen-lockfile --prod=false && pnpm production:build
    startCommand: pnpm production:start
    healthCheckPath: /api/health/ready
    envVars:
      - key: NODE_VERSION
        value: 24.16.0
      - key: NODE_ENV
        value: production
      - key: BUDOGRAPH_DEPLOYMENT_ENV
        value: staging
      - key: HOST
        value: 0.0.0.0
      - key: PORT
        value: "10000"
      - key: WEB_CONCURRENCY
        value: "1"
      - key: SERVE_FRONTEND
        value: "true"
      - key: REMINDER_WORKER_ENABLED
        value: "false"
      - key: DATABASE_TLS_MODE
        value: verify-full
      - key: DATABASE_TLS_CA_FILE
        value: /etc/secrets/database-ca.pem
      - key: DATABASE_URL
        sync: false
      - key: EXPECTED_DATABASE_ID
        sync: false
      - key: EXPECTED_SUPABASE_PROJECT_REF
        sync: false
      - key: EXPECTED_DATABASE_HOST
        sync: false
      - key: BETTER_AUTH_SECRET
        sync: false
      - key: BETTER_AUTH_URL
        sync: false
      - key: PUBLIC_APP_URL
        sync: false
      - key: EMAIL_MODE
        value: resend
      - key: EMAIL_FROM
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: RATE_LIMIT_HMAC_KEY
        sync: false
      - key: EMAIL_OUTBOX_KEY_ID
        sync: false
      - key: EMAIL_OUTBOX_KEYS
        sync: false
