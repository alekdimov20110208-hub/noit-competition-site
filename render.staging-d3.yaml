# D3 separate staging service. Manual deployment requires owner approval.
# Upload database-ca.pem as a Secret File. No migration/pre-deploy command.
services:
  - type: web
    name: budograph-staging-d3
    runtime: node
    plan: free
    region: frankfurt
    numInstances: 1
    branch: staging/render-free-d2-2
    maxShutdownDelaySeconds: 120
    autoDeployTrigger: off
    buildCommand: corepack enable && corepack pnpm install --frozen-lockfile --prod=false && corepack pnpm production:build
    startCommand: node server/dist/src/production.js
    healthCheckPath: /api/health/ready
    envVars:
      - key: NODE_VERSION
        value: 24.16.0
      - key: NODE_ENV
        value: production
      - key: BUDOGRAPH_DEPLOYMENT_ENV
        value: staging
      - key: HOST
        value: 0.0.0.0
      - key: PORT
        value: "10000"
      - key: WEB_CONCURRENCY
        value: "1"
      - key: SERVE_FRONTEND
        value: "true"
      - key: REMINDER_WORKER_ENABLED
        value: "false"
      - key: DATABASE_TLS_MODE
        value: verify-full
      - key: DATABASE_TLS_CA_FILE
        value: /etc/secrets/database-ca.pem
      - key: DATABASE_URL
        sync: false
      - key: EXPECTED_DATABASE_ID
        value: bce50118-4829-42e0-86cd-1cb41de8b1ba
      - key: EXPECTED_SUPABASE_PROJECT_REF
        value: jlladwdqdillryyfvndo
      - key: EXPECTED_DATABASE_HOST
        value: aws-1-eu-central-1.pooler.supabase.com
      - key: BETTER_AUTH_SECRET
        sync: false
      - key: BETTER_AUTH_URL
        sync: false
      - key: PUBLIC_APP_URL
        sync: false
      - key: EMAIL_MODE
        value: resend
      - key: EMAIL_FROM
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: RATE_LIMIT_HMAC_KEY
        sync: false
      - key: EMAIL_OUTBOX_KEY_ID
        sync: false
      - key: EMAIL_OUTBOX_KEYS
        sync: false
